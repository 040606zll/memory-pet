<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>机器狗视觉与连续帧检查</title>
<style>body{margin:20px;background:#eaf4fe;color:#183958;font:14px sans-serif}header{display:flex;gap:12px;margin:12px 0}.compare{display:flex;gap:24px}.pane{width:500px;height:544px;position:relative;overflow:hidden;background:#ddd}.source img{position:absolute;width:1412px;height:1000px;left:-224px;top:-256px}.render{background:url('/assets/robot-dog-room.png') center/cover}canvas{width:500px;height:544px}button{padding:8px 16px}output{display:block;margin:12px 0}</style>
<h1>原型纹理 / 实际机器狗画布</h1><header><button data-action="rest">原型姿态</button><button data-action="idle">自主动作</button><button data-action="blink">眨眼</button><button data-action="wave">前爪挥动</button><button data-action="wag_tail">摇尾巴</button><button data-action="nod">点头</button><button data-action="shake_head">摇头</button><button data-action="stretch">伸懒腰</button><button data-action="happy">开心</button><button data-action="sleep">打盹</button><button data-action="sequence">连续动作验收</button></header>
<div class="compare"><div class="pane source"><img src="/assets/robot-dog-reference.png" alt="原型机器狗裁切"></div><div class="pane render"><canvas width="500" height="544" role="img" aria-label="真实GPU机器狗"></canvas></div></div><output id="metrics">等待加载</output>
<section id="snapshots" style="display:flex;flex-wrap:wrap;gap:12px"></section>
<script type="module">
import { DogRenderer } from '/src/dogRenderer.js';import { DogMotion,DOG } from '/src/dogMotion.js';import { PetMachine } from '/src/petMachine.js';
const canvas=document.querySelector('canvas'),metrics=document.querySelector('output'),image=new Image(),maskImage=new Image(),motion=new DogMotion(),machine=new PetMachine({durations:DOG.durations});let renderer,rest=true,frames=0,start=0,last=0,maxGap=0;
const captured=new Set();const zero={head:0,headY:0,body:0,paw:0,tail:0,ear:0,blink:0};
let loaded=0;image.onload=maskImage.onload=()=>{if(++loaded!==2)return;renderer=new DogRenderer(canvas,image,{diagnose:true,maskImage});requestAnimationFrame(render)};image.src=DOG.src;maskImage.src=DOG.mask;
function render(time){if(!start)start=time;const state=rest?{name:'rest'}:machine.tick(time);renderer.draw(rest?zero:motion.sample(state,time));if(!rest&&state.progress>.35&&state.progress<.65&&!captured.has(state.name)){captured.add(state.name);const item=document.createElement('figure'),saved=document.createElement('canvas'),label=document.createElement('figcaption');saved.width=canvas.width;saved.height=canvas.height;saved.style.width='220px';saved.style.height='auto';saved.getContext('2d').drawImage(canvas,0,0);label.textContent=state.name;item.append(label,saved);document.querySelector('#snapshots').append(item)}frames++;if(last)maxGap=Math.max(maxGap,time-last);last=time;metrics.textContent=JSON.stringify({action:state.name,...renderer.stats,fps:Math.round(frames*1000/(time-start)),maxGap:Math.round(maxGap)});requestAnimationFrame(render)}
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const name=button.dataset.action;rest=name==='rest';if(name==='sequence'){machine.enqueue(Object.keys(DOG.durations).filter(name=>name!=='idle').map(name=>({name,trigger:'explicit'})))}else if(name!=='rest'&&name!=='idle')machine.enqueue([{name,trigger:'explicit'}])});
</script></html>
