<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>机器狗真实逐帧动画验收</title>
<style>body{margin:20px;background:#eaf4fe;color:#183958;font:14px sans-serif}header{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.compare{display:flex;gap:24px}.pane{width:500px;height:544px;position:relative;overflow:hidden}.source img{position:absolute;width:1412px;height:1000px;left:-224px;top:-256px}.render{background:url('/assets/robot-dog-room.png') center/cover}canvas{width:500px;height:544px}button{padding:8px 14px}output{display:block;margin:12px 0}.snapshots{display:flex;flex-wrap:wrap;gap:10px}figure{margin:12px 8px}</style>
<h1>原型角色 / 真实动作帧播放器</h1><header><button data-action="rest">待机首帧</button><button data-action="idle">自主待机</button><button data-action="blink">眨眼</button><button data-action="wave">挥爪</button><button data-action="wag_tail">摇尾巴</button><button data-action="nod">点头</button><button data-action="shake_head">摇头</button><button data-action="stretch">伸懒腰</button><button data-action="happy">开心</button><button data-action="sleep">打盹</button><button data-action="sequence">连续动作验收</button><button data-action="pause">暂停/恢复</button></header>
<div class="compare"><div class="pane source"><img src="/assets/robot-dog-reference.png" alt="原稿同一机器狗"></div><div class="pane render"><canvas width="500" height="544" role="img" aria-label="真实逐帧机器狗"></canvas></div></div><output>等待动作图集加载</output><section class="snapshots"></section>
<script type="module">
import { loadDogSprites,SPRITE_DURATIONS } from '/src/dogSpriteAssets.js';
import { DogSpriteRenderer,SpriteClock,spriteFrame } from '/src/dogSpritePlayer.js';
import { PetMachine } from '/src/petMachine.js';
const canvas=document.querySelector('canvas'),metrics=document.querySelector('output'),clock=new SpriteClock(),machine=new PetMachine({durations:SPRITE_DURATIONS,now:()=>clock.time}),captured=new Set();let rest=true,paused=false,assets,renderer;
loadDogSprites(new AbortController().signal).then(loaded=>{assets=loaded;renderer=new DogSpriteRenderer(canvas,{diagnose:true});requestAnimationFrame(render)}).catch(error=>metrics.textContent=error.message);
function render(wall){if(paused){clock.pause();requestAnimationFrame(render);return}const time=clock.advance(wall),state=rest?{name:'idle',started:0,progress:0}:machine.tick(time),sample=spriteFrame(assets,state,time);renderer.draw(sample,time);if(!rest&&state.started!=null){for(const fraction of [.25,.5,.75]){const key=state.name+':'+fraction;if(state.progress>=fraction&&state.progress<fraction+.04&&!captured.has(key)){captured.add(key);const item=document.createElement('figure'),saved=document.createElement('canvas'),label=document.createElement('figcaption');saved.width=canvas.width;saved.height=canvas.height;saved.style.width='160px';saved.style.height='auto';saved.getContext('2d').drawImage(canvas,0,0);label.textContent=state.name+' · 帧'+sample.index;item.append(label,saved);document.querySelector('.snapshots').append(item)}}}metrics.textContent=JSON.stringify({action:state.name,spriteIndex:sample.index,...renderer.stats});requestAnimationFrame(render)}
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const name=button.dataset.action;if(name==='pause'){paused=!paused;if(!paused)renderer.resume();return}rest=name==='rest';if(name==='sequence')machine.enqueue(Object.keys(SPRITE_DURATIONS).filter(name=>name!=='idle').map(name=>({name,trigger:'explicit'})));else if(name!=='rest'&&name!=='idle')machine.enqueue([{name,trigger:'explicit'}]);});
</script></html>
