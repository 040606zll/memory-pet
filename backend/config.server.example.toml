# 服务器访问白名单及 MySQL 连接示例，不会自动加载；将需要的分组合并到 config.local.toml。
# 已有同名分组时修改原节，不能重复添加；保留已有模型与 MemoryOS 配置。
[server]
# 填写浏览器访问的 IP 或完整域名，不含协议、端口、路径或通配符。
allowed_hosts = "81.71.39.10"
# 精确填写网页来源；当前 HTTP IP 示例。改用 HTTPS 或其他端口时同步修改。
# 正式公网使用应采用 HTTPS，并先在 Nginx 配置站点访问鉴权。
allowed_origins = "http://81.71.39.10"

[mysql]
# 请自行填入实际连接信息；先创建宠物项目独立的全新 MySQL 8 数据库并授权。
# 应用启动只创建缺失业务表，不创建数据库，不读取或迁移旧 SQLite 数据。
host = "127.0.0.1"
port = 3306
database = "memory_pet"
user = "memory_pet"
password = ""

[speech]
# 仅放服务端。支持 PET_SPEECH_API_KEY / PET_SPEECH_URL / PET_TTS_MODEL / PET_TTS_VOICE / PET_ASR_MODEL 环境覆盖。
api_key = ""
# 使用工作空间级 Key 时，将 WorkspaceId 替换为该 Key 所属的真实业务空间。
url = "wss://WorkspaceId.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference"
tts_model = "qwen-audio-3.0-tts-flash"
voice = "longjielidou_v3.6"
asr_model = "fun-asr-realtime"
